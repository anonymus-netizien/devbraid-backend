# Development Profile Configuration
# Activate with: SPRING_PROFILES_ACTIVE=dev

spring:
  config:
    activate:
      on-profile: dev

  # Development-specific JPA settings
  jpa:
    show-sql: ${DEV_JPA_SHOW_SQL:true}
    hibernate:
      ddl-auto: ${DEV_JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: ${DEV_JPA_FORMAT_SQL:true}

  # Development Datasource (local PostgreSQL via Docker)
  datasource:
    url: ${DEV_DB_URL:jdbc:postgresql://localhost:5433/devbraid}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DEV_DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DEV_DB_POOL_MIN_IDLE:2}

  # Flyway enabled for dev
  flyway:
    enabled: ${DEV_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

# Development Server Configuration
server:
  port: ${DEV_SERVER_PORT:8080}
  servlet:
    context-path: /

# Development Logging (more verbose)
logging:
  level:
    root: ${DEV_LOG_LEVEL_ROOT:INFO}
    com.devbraid: ${DEV_LOG_LEVEL_APP:DEBUG}
    org.hibernate.SQL: ${DEV_LOG_LEVEL_HIBERNATE_SQL:DEBUG}
    org.hibernate.type.descriptor.sql.BasicBinder: ${DEV_LOG_LEVEL_HIBERNATE_BIND:TRACE}
    org.springframework.web: ${DEV_LOG_LEVEL_WEB:DEBUG}
    org.springframework.security: ${DEV_LOG_LEVEL_SECURITY:DEBUG}

# Development-specific CORS (allow all origins for local dev)
app:
  cors:
    allowed-origins: ${DEV_CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
    allow-credentials: ${DEV_CORS_ALLOW_CREDENTIALS:true}
  jwt:
    secret: ${DEV_JWT_SECRET:dev-jwt-secret-key-for-development-only-12345678901234567890}
    expiration: ${DEV_JWT_EXPIRATION:86400000}

# Development Features
features:
  swagger-ui: ${DEV_FEATURES_SWAGGER_UI:true}
  api-docs: ${DEV_FEATURES_API_DOCS:true}
  actuator: ${DEV_FEATURES_ACTUATOR:true}
