# Production Profile Configuration
# Activate with: SPRING_PROFILES_ACTIVE=prod

spring:
  config:
    activate:
      on-profile: prod

  # Production JPA settings (minimal logging, validation only)
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  # Production Datasource (all secrets from environment variables)
  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${PROD_DB_POOL_MAX_SIZE:25}
      minimum-idle: ${PROD_DB_POOL_MIN_IDLE:10}
      connection-timeout: ${PROD_DB_POOL_TIMEOUT:30000}
      idle-timeout: ${PROD_DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${PROD_DB_POOL_MAX_LIFETIME:1800000}

  # Flyway enabled for production (no auto-migrate)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false

# Production Server Configuration
server:
  port: ${PROD_SERVER_PORT:8080}
  servlet:
    context-path: /api
  tomcat:
    max-threads: ${PROD_TOMCAT_MAX_THREADS:200}
    min-spare-threads: ${PROD_TOMCAT_MIN_SPARE_THREADS:25}
    accept-count: ${PROD_TOMCAT_ACCEPT_COUNT:100}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

# Production Logging (minimal, structured)
logging:
  level:
    root: WARN
    com.devbraid: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: WARN
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Production CORS (strict, environment-driven)
app:
  cors:
    allowed-origins: ${PROD_CORS_ORIGINS:https://app.devbraid.com}
    allow-credentials: true
  jwt:
    secret: ${PROD_JWT_SECRET}
    access-expiration: ${PROD_JWT_ACCESS_EXPIRATION:1800000}
    refresh-expiration: ${PROD_JWT_REFRESH_EXPIRATION:604800000}

# Production Features (disable dev tools)
features:
  swagger-ui: false
  api-docs: false
  actuator: true

# Production Actuator (minimal exposure)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}

# Production Security Hardening
app.security:
  force-https: ${PROD_FORCE_HTTPS:true}
  hsts-enabled: ${PROD_HSTS_ENABLED:true}
  content-security-policy: ${PROD_CSP:default-src 'self'}
