# Staging Profile Configuration
# Activate with: SPRING_PROFILES_ACTIVE=stage

spring:
  config:
    activate:
      on-profile: stage

  # Staging JPA settings (less verbose than dev)
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  # Staging Datasource (environment variables for secrets)
  datasource:
    url: ${STAGE_DB_URL:jdbc:postgresql://staging-db:5432/devbraid}
    username: ${STAGE_DB_USERNAME:devbraid_user}
    password: ${STAGE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000

  # Flyway enabled for staging
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# Staging Server Configuration
server:
  port: ${STAGE_SERVER_PORT:8080}
  servlet:
    context-path: /api

# Staging Logging (moderate verbosity)
logging:
  level:
    root: WARN
    com.devbraid: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: INFO
    org.springframework.security: INFO

# Staging CORS (restrict to staging domains)
app:
  cors:
    allowed-origins: ${STAGE_CORS_ORIGINS:https://staging.devbraid.com}
    allow-credentials: true
  jwt:
    secret: ${STAGE_JWT_SECRET}
    expiration: ${STAGE_JWT_EXPIRATION:86400000}

# Staging Features
features:
  swagger-ui: true
  api-docs: true
  actuator: true

# Staging Actuator (expose health and info)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
