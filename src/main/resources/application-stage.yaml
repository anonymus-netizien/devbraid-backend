# Staging Profile Configuration
# Activate with: SPRING_PROFILES_ACTIVE=stage

spring:
  config:
    activate:
      on-profile: stage

  # Staging JPA settings (less verbose than dev)
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  # Staging Datasource (Neon Postgres via environment variables)
  datasource:
    url: ${STAGE_DB_URL}
    username: ${STAGE_DB_USERNAME}
    password: ${STAGE_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${STAGE_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${STAGE_DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000

  # Flyway enabled for staging
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# Staging Server Configuration
server:
  port: ${PORT:8080}

# Staging Logging (moderate verbosity)
logging:
  level:
    root: WARN
    com.devbraid: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: INFO
    org.springframework.security: INFO

# Staging CORS (restrict to staging domains)
app:
  cors:
    allowed-origins: ${STAGE_CORS_ORIGINS:https://staging.devbraid.com}
    allow-credentials: true
  clerk:
    jwks-url: ${CLERK_JWKS_URL}
    issuer: ${CLERK_ISSUER:}
  encryption:
    key: ${STAGE_ENCRYPTION_KEY}

# Staging Actuator (expose health and info)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Staging OpenAPI Documentation (enabled)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true