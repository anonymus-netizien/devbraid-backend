services:
  postgres:
    image: postgres:18-alpine
    container_name: devbraid-db
    environment:
      - POSTGRES_DB=devbraid
      - POSTGRES_USER=${DEV_DB_USERNAME}
      - POSTGRES_PASSWORD=${DEV_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
