services:
  postgres:
    image: postgres:18-alpine
    container_name: devbraid-db
    environment:
      - POSTGRES_DB=devbraid
      - POSTGRES_USER=${DEV_DB_USERNAME:-devbraid_user}
      - POSTGRES_PASSWORD=${DEV_DB_PASSWORD:-devbraid_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DEV_DB_USERNAME:-devbraid_user} -d devbraid" ]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    container_name: devbraid-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DEV_DB_URL=jdbc:postgresql://postgres:5432/devbraid
      - DEV_DB_USERNAME=${DEV_DB_USERNAME:-devbraid_user}
      - DEV_DB_PASSWORD=${DEV_DB_PASSWORD:-devbraid_password}
      - DEV_CORS_ORIGINS=${DEV_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4200}
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: devbraid-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@devbraid.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
